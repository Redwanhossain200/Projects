<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Web Development Learning Hub">
  <meta name="keywords" content="html, css, javascript, web development, interactive, learning">
  <meta name="author" content="Redwan Hossain">
  <link rel="shortcut icon" href="../Images/download.png" type="image/x-icon">
  <title>Animated Cake</title>
  <link rel="stylesheet" href="1st.css">
</head>

<body>
  <main class="scene" aria-label="Animated celebration cake">
    <div class="cake" role="img" aria-hidden="false">
      <div class="tier bottom">
        <div class="sprinkles">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="tier middle">
        <div class="sprinkles">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="tier top">
        <div class="icing"></div>
        <div class="sprinkles">
          <span></span><span></span>
        </div>
        <div class="candles">
          <div class="candle">
            <div class="flame"></div>
          </div>
          <div class="candle">
            <div class="flame"></div>
          </div>
          <div class="candle">
            <div class="flame"></div>
          </div>
        </div>
      </div>
      <div class="plate"></div>
    </div>
    <p class="caption">Make a wish!</p>
  </main>

</body>

</html>
